name: Build and publish Windows executables

on:
  push:
    branches: [ 'master', 'release' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW & Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build with MinGW (Release)
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw -j 4

      - name: Collect executables
        shell: pwsh
        run: |
          $art = Join-Path $PWD artifacts
          if (!(Test-Path $art)) { New-Item -ItemType Directory -Path $art | Out-Null }
          $names = @('GooseRot-Safe.exe','GooseRot-Normal.exe','GooseRot-Lab.exe','GooseRot-Lab-Debug.exe','GooseBootPreview.exe')
          foreach ($n in $names) {
            $found = Get-ChildItem -Path build-mingw -Filter $n -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName -Destination $art -Force }
          }
          Get-ChildItem $art

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-executables
          path: artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'GooseRot Release' }}
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}