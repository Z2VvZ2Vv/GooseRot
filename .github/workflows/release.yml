name: Build and publish Windows executables

on:
  push:
    branches: [ 'release' ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets (Release)
        run: cmake --build build --config Release --target ALL_BUILD -- /m

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $names = @('GooseRot-Safe.exe','GooseRot-Normal.exe','GooseRot-Lab.exe','GooseRot-Lab-Debug.exe')
          foreach ($n in $names) {
            $found = Get-ChildItem -Path . -Filter $n -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName -Destination artifacts -Force }
          }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-executables
          path: artifacts/
name: release-build

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build release bundle
        shell: pwsh
        run: cmake --build build --config Release --target gooserot_release --parallel

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: gooserot-release-windows
          path: build/dist/**