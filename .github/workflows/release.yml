name: Build and publish Windows executables

on:
  push:
    branches: [ 'master', 'release' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gooserot-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW & Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build with MinGW (Release)
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOOSEROT_BUILD_TESTS=ON \
            -DGOOSEROT_BUILD_BOOT_PREVIEW=ON \
            -DGOOSEROT_BUILD_BOOT_FIRMWARE=ON
          cmake --build build-mingw -j 4

      - name: Verify tests and embedded Lab firmware
        shell: msys2 {0}
        run: |
          cmake --build build-mingw --target gooserot_lab_resource_tests -j 4
          ctest --test-dir build-mingw --output-on-failure

      - name: Collect executables
        shell: pwsh
        run: |
          $art = Join-Path $PWD artifacts
          if (!(Test-Path $art)) { New-Item -ItemType Directory -Path $art | Out-Null }
          $names = @('GooseRot-Safe.exe','GooseRot-Normal.exe','GooseRot-Lab.exe','GooseRot-Lab-Debug.exe','GooseBootPreview.exe')
          foreach ($n in $names) {
            $source = Join-Path (Join-Path $PWD 'build-mingw/bin') $n
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required release executable is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $art -Force
          }
          $checksums = foreach ($n in $names) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $art $n) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $n"
          }
          [IO.File]::WriteAllLines((Join-Path $art 'SHA256SUMS.txt'), $checksums)
          Get-ChildItem $art

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-executables
          path: artifacts/
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'GooseRot Release' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
