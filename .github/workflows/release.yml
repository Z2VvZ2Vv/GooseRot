name: Build and publish Windows executables

on:
  push:
    branches: [ 'release' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build x64 (Release)
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-x64 --config Release --target ALL_BUILD -- /m

      - name: Build Win32 (Visual Studio)
        shell: pwsh
        run: |
          cmake -S . -B build-win32 -G "Visual Studio 17 2022" -A Win32
          cmake --build build-win32 --config Release --target gooserot_release --parallel

      - name: Collect executables
        shell: pwsh
        run: |
          $art = Join-Path $PWD artifacts
          if (!(Test-Path $art)) { New-Item -ItemType Directory -Path $art | Out-Null }
          $names = @('GooseRot-Safe.exe','GooseRot-Normal.exe','GooseRot-Lab.exe','GooseRot-Lab-Debug.exe')
          foreach ($n in $names) {
            $found = Get-ChildItem -Path . -Filter $n -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName -Destination $art -Force }
          }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-executables
          path: artifacts/